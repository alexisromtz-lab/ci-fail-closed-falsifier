# HUELLA-CI-TEMPLATE-20261020
#
# Plantilla de CI fail-closed para los repositorios sin medición.
#
# INERTE EN ESTE REPO POR DISEÑO. El job solo corre donde el repo se adopta
# declarando el marcador `.github/ci-fail-closed`. Sin marcador el job aparece
# como *skipped* — que es "no medí", no un verde.
#
# ADOPTAR (dos piezas, ambas necesarias):
#   1. copiar este archivo a <repo>/.github/workflows/ci.yml
#   2. crear <repo>/.github/ci-fail-closed
#
# El criterio no se mueve: sin tests ⇒ rojo. El código de salida de las
# acciones se toma de los SHAs, no de tags móviles.

name: ci-fail-closed

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: hashFiles('.github/ci-fail-closed') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Probar existencia de tests (fail-closed)
        run: |
          set -euo pipefail
          found=$(find . \( -name 'test_*.py' -o -name '*_test.py' \) \
                    -not -path './.git/*' -not -path '*/node_modules/*' \
                    -not -path './.venv/*' -print -quit)
          if [ -z "$found" ]; then
            echo "NO_TESTS_FOUND: no test_*.py / *_test.py in the tree — failing closed."
            exit 1
          fi
          echo "TESTS_FOUND: $found"

      - name: Instalar dependencias (falla cerrado)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip > /dev/null
          python -m pip install pytest
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install -e .
          else
            echo "SIN_MANIFIESTO: no requirements.txt ni pyproject.toml — pytest pelado."
          fi

      - name: Correr tests (cero recogidos = rojo)
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q
          rc=$?
          set -e
          if [ "$rc" -eq 5 ]; then
            echo "NO_TESTS_COLLECTED: pytest no recogió ningún test — failing closed."
            exit 1
          fi
          exit "$rc"
