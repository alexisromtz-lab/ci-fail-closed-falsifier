# HUELLA-CI-TEMPLATE-NODE-20261020
# HUELLA-CI-NODE-V2-VACUIDAD-20261020
# HUELLA-CI-NODE-V3-EJECUCION-20261020
# HUELLA-CI-NODE-V4-CONTRATO-DECLARACION-20261020
# HUELLA-CI-NODE-V5-JUNITXML-20261020
#
# Variante Node de la plantilla fail-closed (`ci_template.yml`) para los repos
# cuyo aparato no es Python: TypeScript/Next y bóvedas de documentación con
# scripts node.
#
# INERTE EN SU REPO DE ORIGEN POR DISEÑO: el job se declara *skipped* aquí
# (skipped = «no medí», nunca un verde) y solo mide donde se adopta.
#
# ADOPTAR: copiar este archivo a <repo>/.github/workflows/ci.yml y declarar el
# CONTRATO en <repo>/.github/ci-apparatus (dos campos + evidencia obligatoria):
#     comando: <comando real; escribe /tmp/junit.xml si mide: tests>
#     mide: tests | sintaxis | manifiesto | banco
#     evidencia: junitxml                                (obligatorio si mide: tests)
#     evidencia: <regex que el verificador imprime>      (obligatorio si mide: manifiesto | banco)
# Sin declaración NO se inventa un `npm test`: si `package.json` no trae script
# `test`, el job FALLA (NO_APPARATUS_DECLARED). Un repo Node sin aparato
# declarado no es verde.
#
# FALSIFICADOR medido en los dos adoptantes (2026-10-20):
#   meta-webhook  `npx tsc --noEmit`              error de tipo inyectado -> rc 2 (rojo)
#   legos-boveda  `node .github/verify_index.mjs` documento sin fila     -> rc 1 (rojo)
#
# FALSIFICADOR PERMANENTE (v2) en alexisromtz-lab/ci-fail-closed-falsifier:
# una rama por control, todas sobre este mismo blob (ver ACTA_CI_FALSADOR_NODE_20261020.md).
#
# CORRECCIÓN 5 (v2): `npm test` con `"test": "echo ok"` devolvía rc 0 y firmaba un
# verde sin medir nada — la tautología F-D1 en Node. Ahora, cuando el aparato es
# DETECTADO (script `test` de package.json), se exigen dos cosas: que el script no
# sea un no-op literal (`echo`/`true`/`:`/`exit`/`--passWithNoTests`) y que exista
# al menos un archivo de test del repo (node_modules y .git excluidos).
#   · El aparato DECLARADO en `.github/ci-apparatus` no pasa por la sonda de
#     archivos: `npx tsc --noEmit` y `node .github/verify_index.mjs` miden sin
#     tener un solo `*.test.ts` (medido 2026-10-20T22:45Z: los dos adoptantes no
#     tienen ninguno). Una guarda de existencia aplicada a todo habría puesto en
#     rojo a los dos repos con aparato real — el sensor ajeno, invertido. Al
#     declarado solo se le exige que no sea un no-op literal.
#   · LÍMITE DECLARADO: la sonda mide **presencia de archivos**, no ejecución. Un
#     script `test` que ignore sus propios `*.test.ts` seguiría verde: es el mismo
#     Nivel 3 que este corpus audita en PyTorch. Por eso el repo cuyo aparato
#     corre de verdad debe DECLARARLO: la declaración es la firma de quien mide.
#
# CORRECCIÓN 6 (v3): `VACUIDAD_OK` probaba PRESENCIA de archivos, no EJECUCIÓN.
# Un `"test": "node -e \"process.exit(0)\""` con un `*.test.ts` al lado pasaba
# verde sin correr nada. Ahora el camino DETECTADO captura la salida completa del
# runner (`tee`, rc por `PIPESTATUS`) y exige que **el runner reporte ≥1 test
# ejecutado**, leyendo los formatos de node --test (`# pass N`, TAP `ok N`),
# jest (`Tests: N passed`), vitest (`Tests N passed`), mocha (`N passing`) y bun
# (`N tests passed`). Un `0` explícito de cualquiera de esos formatos es rojo
# aunque otra línea parezca positiva.
#   · El aparato DECLARADO queda exento (`EJECUCION_NA`): `tsc --noEmit` y un
#     verificador de índice no imprimen conteos, y exigírselos sería volver al
#     sensor ajeno de la CORRECCIÓN 5, un piso más arriba.
#   · LÍMITE DECLARADO: se mide **lo que el runner narra**, no lo que ejecutó. Un
#     test que imprima «1 passing» sin correr nada engaña a esta guarda. Es una
#     medida de segundo orden: mejor que contar archivos, peor que instrumentar
#     el runner. Se declara para que nadie la lea como prueba de cobertura.
#
# CORRECCIÓN 7 (v4): el aparato DECLARADO era un agujero con forma de exención.
# `VACUIDAD_NA` + `EJECUCION_NA` eximían a todo aparato declarado: un
# `node -e 'process.exit(0)'` en .github/ci-apparatus devolvía rc 0 y firmaba
# verde sin medir una sola aserción. La declaración deja de ser un comando suelto
# y pasa a ser un CONTRATO: `comando:` + `mide:` (+ `evidencia:` si es manifiesto).
#   · mide: tests      -> matriz de conteo de la v3 (>= 1 test reportado; un 0
#                         explícito del runner es rojo aunque otra línea sonría).
#   · mide: sintaxis   -> whitelist de chequeadores (tsc | eslint | node --check)
#                         y rc 0: el silencio del chequeador ES la evidencia.
#   · mide: manifiesto -> exige `evidencia:` presente en la salida Y con un entero
#                         > 0. Un veredicto sobre 0 artefactos no es una medida.
#   · mide: binario    -> RESERVADO, no implementado: falla cerrado, nunca verde.
# Y en TODOS los tipos se prohíbe la EVALUACIÓN EN LÍNEA (`node -e/--eval/-p/--print`,
# `python -c`, `sh|bash|zsh -c`, `eval`): la evidencia tiene que venir de un archivo
# versionado del repo, auditable y diffeable, no de un one-liner escondido en un
# archivo de configuración. Y se veta el no-op por nombre base (`true`, `echo`,
# `printf`, `:`, `exit`, también `/bin/true` y `env true`).
#   · MEDIDO ANTES DE ESCRIBIR (2026-10-20): los dos adoptantes usan
#     `node .github/verify_index.mjs` y `npx tsc --noEmit`. Ninguno tiene un solo
#     archivo `*.test.*` (0 y 0). Una whitelist cerrada de runners los habría
#     puesto rojos — el sensor ajeno otra vez. Una prohibición de eval no les
#     cuesta nada: los dos son archivo y whitelist.
#   · LÍMITE DECLARADO: la prohibición mira el PRIMER token (tras `env`); un
#     `node -e` encadenado DETRÁS de un aparato real no se caza, pero ahí ya midió
#     el aparato. Y un archivo versionado que imprima la evidencia sin medir sigue
#     engañando a la guarda: se mide lo que el aparato NARRA. Tercera medida de
#     orden — mejor que contar archivos, peor que instrumentar el runner.
#
# CORRECCIÓN 8 (v5): el texto del runner NO es contrato. La v4 decidía el verde
# leyendo la narración (siete familias de regex: node --test, jest, vitest, mocha,
# bun, TAP). Tres falsos rojos medidos en la ley hermana de Python —sangría de
# mocha (`  2 passing`), glifo de Node 24 (`ℹ pass 2`) y `====== 26 passed ======`
# de pytest— demuestran que el formato cambia con el runner, con la versión y con
# la terminal: un sensor así pone en rojo a un aparato que SÍ midió. La v5 retira
# el parseo de texto y adopta lo que el runner produce: el informe JUnit.
#   · `mide: tests` exige `evidencia: junitxml` y que el `comando:` DECLARADO
#     escriba /tmp/junit.xml (jest --reporters=jest-junit · mocha --reporter xunit
#     · vitest --reporter=junit --outputFile=/tmp/junit.xml · node --test
#     --test-reporter=junit --test-reporter-destination=/tmp/junit.xml).
#   · Se rechaza que el workflow inyecte el reporter si falta: inventar el flag es
#     el mismo reescribir-escondido que el alias `pytest` de la ERRATA 2. Si no
#     está declarado, APPARATUS_INCOMPATIBLE, y el mensaje dice qué falta.
#   · Se cuenta `<testcase>`, no los atributos `tests="N"` de la raíz: un informe
#     de varias suites trae un `<testsuite>` por suite y el atributo de la raíz
#     subcuenta (misma familia que `head -1` en la ley hermana). Consecuencia
#     medida: el XML fabricado `<testsuite tests="26" failures="0"/>` NO es verde,
#     cae en NO_TESTS porque no tiene ni un `<testcase>`.
#   · El informe MANDA sobre el rc: rc 0 con `<failure>` es TESTS_FAILED, y un
#     informe donde todos los casos están `<skipped/>` es VACUIDAD_SKIP. El rc de
#     un runner que salta todo es 0 — el verde que la v4 no podía ver.
#   · JUNIT_VIEJO: mtime anterior al inicio de esta corrida ⇒ el informe no lo
#     produjo este aparato; un /tmp/junit.xml heredado no certifica nada.
#   · El instrumento parsea XML con `python3` (presente en ubuntu-latest), el
#     MISMO parser que la ley hermana. No se añade `xmllint`: dos herramientas para
#     el mismo veredicto son dos contratos que divergen.
#   · El camino DETECTADO (`npm test` sin declaración) no puede exigir JUnit sin
#     reescribir el script ajeno — la ley no inventa el comando. Conserva las
#     guardas de vacuidad de la v2/v3 y ahora también pide informe: si el script no
#     escribe /tmp/junit.xml, es NO_JUNITXML con la instrucción de declarar.
#   · LÍMITE DECLARADO (cuarto orden): un informe JUnit fabricado a mano, con
#     `<testcase>` de verdad, sigue engañando a esta guarda — el instrumento no
#     distingue un objeto de su falso; fabricarlo exige un archivo versionado y
#     declarado (visible en el diff), no un one-liner escondido. Se declara.
#

name: ci-fail-closed-node

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.repository != 'alexisromtz-lab/platino-labs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Resolver el aparato (contrato v5 — declaración gana a detección)
        run: |
          set -euo pipefail
          if [ -f .github/ci-apparatus ]; then
            campos=$(tr -d '\r' < .github/ci-apparatus \
              | grep -v '^[[:space:]]*#' | grep -v '^[[:space:]]*$' || true)
            cmd=$(printf '%s\n' "$campos" | sed -n 's/^[[:space:]]*comando:[[:space:]]*//p' | head -n 1)
            mide=$(printf '%s\n' "$campos" | sed -n 's/^[[:space:]]*mide:[[:space:]]*//p' | head -n 1)
            evid=$(printf '%s\n' "$campos" | sed -n 's/^[[:space:]]*evidencia:[[:space:]]*//p' | head -n 1)
            suelta=$(printf '%s\n' "$campos" | grep -vE '^[[:space:]]*(comando|mide|evidencia):' | head -n 1 || true)
            if [ -z "$cmd" ] && [ -n "$suelta" ]; then
              echo "APPARATUS_SIN_TIPO: declaración de un solo campo ('$suelta'). El contrato v5 exige 'comando:' + 'mide:' + 'evidencia:' (junitxml si mide=tests; regex si mide=manifiesto o banco) — failing closed."
              exit 1
            fi
            if [ -z "$cmd" ] || [ -z "$mide" ]; then
              echo "APPARATUS_EMPTY: .github/ci-apparatus no declara 'comando:' y 'mide:' a la vez — failing closed."
              exit 1
            fi
            {
              printf 'APPARATUS=%s\n' "$cmd"
              printf 'MIDE=%s\n' "$mide"
              printf 'EVIDENCIA=%s\n' "$evid"
              printf 'ORIGEN=declarado\n'
            } >> "$GITHUB_ENV"
            echo "APPARATUS_DECLARED: $cmd"
            echo "APPARATUS_MIDE: $mide"
          elif [ -f package.json ] && node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.test ? 0 : 1)"; then
            script=$(node -e "process.stdout.write(require('./package.json').scripts.test)")
            echo "APPARATUS_DETECTED: npm test (sin declaración: el informe JUnit lo tiene que escribir el propio script)"
            {
              printf 'APPARATUS=%s\n' 'npm test'
              printf 'MIDE=tests\n'
              printf 'EVIDENCIA=junitxml\n'
              printf 'ORIGEN=detectado\n'
              printf 'APPARATUS_SCRIPT<<__CI_EOF__\n'
              printf '%s\n' "$script"
              printf '__CI_EOF__\n'
            } >> "$GITHUB_ENV"
          else
            echo "NO_APPARATUS_DECLARED: no .github/ci-apparatus y package.json sin script test — failing closed."
            exit 1
          fi

      - name: Validar la declaración (v5 — eval en línea prohibido, tipo y evidencia)
        run: |
          set -euo pipefail
          case "$MIDE" in
            tests|sintaxis|manifiesto|banco) ;;
            binario)
              echo "MIDE_NO_IMPLEMENTADO: 'mide: binario' está reservado y no implementado; un tipo sin implementación no puede firmar verde — failing closed."
              exit 1 ;;
            *)
              echo "APPARATUS_TIPO_DESCONOCIDO: 'mide: $MIDE' fuera del vocabulario (tests | sintaxis | manifiesto | banco) — failing closed."
              exit 1 ;;
          esac

          primer=$(printf '%s' "$APPARATUS" | awk '{print $1}')
          resto=$(printf '%s' "$APPARATUS" | cut -s -d' ' -f2-)
          if [ "$primer" = "env" ]; then
            primer=$(printf '%s' "$resto" | awk '{print $1}')
            resto=$(printf '%s' "$resto" | cut -s -d' ' -f2-)
          fi
          base=${primer##*/}
          case "$base" in
            true|false|:|echo|printf|exit)
              echo "APPARATUS_VACUO: '$APPARATUS' no mide nada — failing closed."
              exit 1 ;;
            eval|exec|source)
              echo "APPARATUS_INVALIDO: '$APPARATUS' evalúa en línea; la evidencia tiene que ser un archivo versionado — failing closed."
              exit 1 ;;
            node)
              if printf '%s' "$resto" | grep -qE '(^|[[:space:]])(-e|--eval|-p|--print)([[:space:]]|=|$)'; then
                echo "APPARATUS_INVALIDO: 'node' con evaluación en línea (-e/--eval/-p/--print) no es un aparato: fija el código en un archivo versionado — failing closed."
                exit 1
              fi ;;
            python|python3)
              if printf '%s' "$resto" | grep -qE '(^|[[:space:]])-c([[:space:]]|=|$)'; then
                echo "APPARATUS_INVALIDO: '$base -c' evalúa en línea; la evidencia tiene que ser un archivo versionado — failing closed."
                exit 1
              fi ;;
            bash|sh|zsh|dash|ksh)
              if printf '%s' "$resto" | grep -qE '(^|[[:space:]])-c([[:space:]]|=|$)'; then
                echo "APPARATUS_INVALIDO: '$base -c' evalúa en línea; el banco de casos tiene que ser un archivo versionado — failing closed."
                exit 1
              fi ;;
          esac
          echo "DECLARACION_OK: mide=$MIDE · $APPARATUS"

          if [ "$MIDE" = "sintaxis" ]; then
            chequeador=$base
            if [ "$chequeador" = "npx" ]; then
              chequeador=$(printf '%s' "$resto" | awk '{print $1}')
              if [ "$chequeador" = "-y" ] || [ "$chequeador" = "--yes" ]; then
                chequeador=$(printf '%s' "$resto" | awk '{print $2}')
              fi
            fi
            if [ "$chequeador" = "node" ]; then
              if ! printf '%s' "$resto" | grep -qE '^[[:space:]]*--check([[:space:]]|=|$)'; then
                echo "APPARATUS_INVALIDO: mide=sintaxis con 'node' exige '--check' (la sintaxis se mide, no se ejecuta) — failing closed."
                exit 1
              fi
            elif [ "$chequeador" != "tsc" ] && [ "$chequeador" != "eslint" ]; then
              echo "APPARATUS_INVALIDO: mide=sintaxis pero '$chequeador' no es un chequeador de la whitelist (tsc | eslint | node --check) — failing closed."
              exit 1
            fi
            echo "SINTAXIS_DECLARADA: chequeador '$chequeador'."
          fi

          if [ "$MIDE" = "manifiesto" ] || [ "$MIDE" = "banco" ]; then
            if [ -z "$EVIDENCIA" ]; then
              echo "APPARATUS_SIN_EVIDENCIA: mide=$MIDE exige 'evidencia:' (regex que el verificador imprime al medir); sin ella un rc 0 no distingue medir de no medir — failing closed."
              exit 1
            fi
            echo "EVIDENCIA_DECLARADA: /$EVIDENCIA/"
          fi

          if [ "$MIDE" = "tests" ] && [ "$EVIDENCIA" != "junitxml" ]; then
            echo "APPARATUS_INCOMPATIBLE: mide=tests exige 'evidencia: junitxml' y que 'comando:' escriba /tmp/junit.xml (jest --reporters=jest-junit | mocha --reporter xunit | vitest --reporter=junit --outputFile | node --test --test-reporter=junit); leer la narración del runner no es contrato (tres falsos rojos medidos en la ley hermana) — failing closed."
            exit 1
          fi
          if [ "$EVIDENCIA" = "junitxml" ] && [ "$MIDE" != "tests" ]; then
            echo "APPARATUS_INCOMPATIBLE: 'evidencia: junitxml' solo vale con mide=tests; mide=$MIDE exige el regex literal que imprime su verificador — failing closed."
            exit 1
          fi
          echo "DECLARACION_OK: mide=$MIDE · $APPARATUS · evidencia=${EVIDENCIA:-—}"

      - name: Guarda de vacuidad (un script de test que no mide no es verde)
        run: |
          set -euo pipefail
          if [ "$ORIGEN" != "detectado" ]; then
            echo "VACUIDAD_DELEGADA: aparato declarado; la evidencia la exigen 'Validar la declaración' y 'Correr el aparato' según mide=$MIDE."
            exit 0
          fi
          : "${APPARATUS_SCRIPT:?APPARATUS_SCRIPT no resuelto}"
          case "$APPARATUS_SCRIPT" in
            echo*|true|:|exit*|printf*|"")
              echo "APPARATUS_VACUO: '$APPARATUS_SCRIPT' no mide nada — failing closed."
              exit 1 ;;
          esac
          if printf '%s' "$APPARATUS_SCRIPT" | grep -q -- '--passWithNoTests'; then
            echo "APPARATUS_VACUO: '--passWithNoTests' declara que pasar sin tests es verde — failing closed."
            exit 1
          fi
          found=$(find . \( -name .git -o -name node_modules \) -prune -o -type f \
            \( -name '*.test.js' -o -name '*.test.mjs' -o -name '*.test.cjs' \
               -o -name '*.test.ts' -o -name '*.test.tsx' \
               -o -name '*.spec.js' -o -name '*.spec.mjs' -o -name '*.spec.cjs' \
               -o -name '*.spec.ts' -o -name '*.spec.tsx' \
               -o -name 'test.js' -o -name 'test.mjs' \
               -o \( -path './test/*' -name '*.js' \) -o \( -path './tests/*' -name '*.js' \) \
               -o \( -path './test/*' -name '*.ts' \) -o \( -path './tests/*' -name '*.ts' \) \
               -o \( -path '*/__tests__/*' -name '*.js' \) \
               -o \( -path '*/__tests__/*' -name '*.ts' \) \) -print -quit)
          if [ -z "$found" ]; then
            echo "NO_TESTS_FOUND: '$APPARATUS_SCRIPT' pero el repo no tiene archivos de test (node_modules y .git excluidos) — failing closed."
            exit 1
          fi
          echo "VACUIDAD_OK: script '$APPARATUS_SCRIPT' + archivo de test '$found'."

      - name: Instalar dependencias (falla cerrado)
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          elif [ -f package.json ]; then
            echo "SIN_LOCKFILE: npm install (sin árbol reproducible)"
            npm install --no-audit --no-fund
          else
            echo "SIN_MANIFIESTO: no package.json — el aparato debe ser node puro."
          fi

      - name: Correr el aparato (v5 — rc, evidencia por tipo e instrumento junitxml)
        run: |
          set -euo pipefail
          echo "RUN_APPARATUS: $APPARATUS"
          rm -f /tmp/junit.xml
          inicio=$(date +%s)
          log=$(mktemp)
          set +e
          bash -c "$APPARATUS" 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "APPARATUS_RC=$rc"
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          if [ "$MIDE" = "sintaxis" ]; then
            if [ -n "$EVIDENCIA" ] && ! grep -qE "$EVIDENCIA" "$log"; then
              echo "VACUIDAD_EVIDENCIA: mide=sintaxis con rc 0 pero la evidencia declarada /$EVIDENCIA/ no aparece en la salida — failing closed."
              exit 1
            fi
            msg="SINTAXIS_OK: rc 0 del chequeador '$APPARATUS'"
            if [ -n "$EVIDENCIA" ]; then msg="$msg · evidencia /$EVIDENCIA/"; fi
            echo "$msg"
            exit 0
          fi
          if [ "$MIDE" = "manifiesto" ] || [ "$MIDE" = "banco" ]; then
            etq=$(printf '%s' "$MIDE" | tr '[:lower:]' '[:upper:]')
            if ! grep -qE "$EVIDENCIA" "$log"; then
              echo "VACUIDAD_${etq}: la evidencia declarada /$EVIDENCIA/ no aparece en la salida; un rc 0 sin veredicto no es una medida — failing closed."
              exit 1
            fi
            if ! grep -E "$EVIDENCIA" "$log" | grep -qE '[1-9]'; then
              echo "VACUIDAD_${etq}: la evidencia /$EVIDENCIA/ no trae ningún entero > 0; un veredicto sobre 0 elementos no mide nada — failing closed."
              exit 1
            fi
            echo "${etq}_OK: evidencia /$EVIDENCIA/ presente y con conteo."
            exit 0
          fi

          set +e
          python3 - "$inicio" "$ORIGEN" <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET

          RUTA = '/tmp/junit.xml'
          inicio = int(sys.argv[1]) if len(sys.argv) > 1 else 0
          origen = sys.argv[2] if len(sys.argv) > 2 else ''

          def local(tag):
              return tag.rsplit('}', 1)[-1]

          if not os.path.exists(RUTA):
              print("NO_JUNITXML: mide=tests y el aparato no generó /tmp/junit.xml "
                    "(declara el reporter dentro de 'comando:': jest --reporters=jest-junit | "
                    "mocha --reporter xunit | vitest --reporter=junit --outputFile=/tmp/junit.xml | "
                    "node --test --test-reporter=junit --test-reporter-destination=/tmp/junit.xml) "
                    "— failing closed.")
              sys.exit(1)

          mtime = int(os.path.getmtime(RUTA))
          if inicio and mtime < inicio - 1:
              print(f"JUNIT_VIEJO: /tmp/junit.xml es anterior a esta corrida "
                    f"(mtime {mtime} < inicio {inicio}); ese informe no lo produjo el aparato — failing closed.")
              sys.exit(1)

          try:
              raiz = ET.parse(RUTA).getroot()
          except Exception as e:
              print(f"JUNIT_INVALIDO: /tmp/junit.xml no parsea ({e}) — failing closed.")
              sys.exit(1)

          casos = [e for e in raiz.iter() if local(e.tag) == 'testcase']
          if not casos:
              print("NO_TESTS: el informe no tiene ningún elemento <testcase>; "
                    "un informe sin casos no mide nada — failing closed.")
              sys.exit(1)

          fallos = errores = omitidos = 0
          for c in casos:
              hijos = {local(h.tag) for h in c}
              if 'failure' in hijos:
                  fallos += 1
              if 'error' in hijos:
                  errores += 1
              if 'skipped' in hijos:
                  omitidos += 1

          if fallos or errores:
              print(f"TESTS_FAILED: {fallos} fallo(s) y {errores} error(es) en {len(casos)} casos "
                    f"según el informe; el informe manda sobre el rc — failing closed.")
              sys.exit(1)

          medidos = len(casos) - omitidos
          if medidos < 1:
              print(f"VACUIDAD_SKIP: los {len(casos)} casos del informe están omitidos; "
                    f"un verde de casos que no corrieron es un falso verde — failing closed.")
              sys.exit(1)

          print(f"EJECUCION_OK: {medidos} test(s) ejecutados de {len(casos)} casos · "
                f"{fallos} fallos · {errores} errores · {omitidos} omitidos (junitxml).")
          PY
          rc2=$?
          set -e
          if [ "$rc2" -ne 0 ]; then
            echo "EJECUCION_RC=$rc2"
            exit "$rc2"
          fi
